<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dev</title>

    <!-- Tailwind -->
    <link rel="stylesheet" href="./src/styles/input.css">
    <link rel="stylesheet" href="./src/styles/main.css">

    <script type="module" src="./src/index.ts"></script>
  </head>
  <body>

    <main class="w-full flex flex-col flex-1">


      <div class="navbar bg-blue-950 flex flex-col gap-4 flex-wrap">

        <section class="flex justify-center items-center">
          <h1 class="text-white font-bold text-xl mt-5">
            E-Commerce Product Management System</h1>
        </section>

        <div class="flex flex-col items-center md:flex-row gap-8">

          <input id="searchBar" type="text" placeholder="Search" class="input w-auto md:w-80" />
          
          <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
              <button class="btn btn-primary">SortBy</button>
            </div>
            <ul
              tabindex="-1"
              class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
              <li><a>Title</a></li>
              <li><a>Price low to high</a></li>
              <li><a>Price high to low</a></li>
              <li><a>Category</a></li>
            </ul>
          </div>
        </div>
      </div>

      <section class="flex flex-col gap-10">

        <button id="addProduct" class="btn btn-primary ms-6 mt-6 w-20">ADD +</button>
        
        <!-- Table by DaisyUI -->
        <div class="overflow-x-auto mx-auto">
          <table class="table table-xs">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
                <th>Category</th>
                <th>Discount</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="productsTable">
              <!-- ts will add fields here -->
              
            </tbody>
          </table>
        </div>
        
      </section>

    </main>

  </body>
</html>
